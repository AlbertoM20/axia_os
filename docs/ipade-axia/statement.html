<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Open Statement VALIA · 8 láminas</title>
  <meta name="description" content="Open Statement de VALIA en carrusel de 8 láminas.">
  <style>
    :root{--lime:#c9ff00;--bg:#08090d;--panel:#0f1118;--line:rgba(255,255,255,.14);--muted:#b8bac4}
    *{box-sizing:border-box} html,body{margin:0} body{background:var(--bg);color:#fff;font-family:Inter,Arial,sans-serif}
    .bar{position:sticky;top:0;z-index:30;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:rgba(7,8,12,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
    .brand{font-weight:900;letter-spacing:3px;font-size:22px;color:#fff;text-decoration:none}
    .actions{display:flex;gap:10px;align-items:center}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 16px;border-radius:999px;text-decoration:none;font-size:13px;font-weight:800;border:1px solid transparent}
    .ghost{border-color:rgba(255,255,255,.28);color:#fff}.primary{background:var(--lime);color:#111}
    .wrap{max-width:1200px;margin:0 auto;padding:28px 16px 90px}
    .intro{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:18px}
    .intro h1{margin:0;font-size:clamp(28px,4vw,46px)} .intro p{margin:8px 0 0;color:var(--muted);max-width:700px;line-height:1.5}
    .counter{color:var(--muted);font-size:13px;white-space:nowrap}
    .viewer{background:linear-gradient(180deg,#111521,#0d0f15);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.36)}
    .stage{position:relative;background:#0b0d12;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}
    .slide{display:none;width:100%;height:100%}.slide.active{display:block}.sprite{width:100%;height:100%;background-image:url("opening-sprite.webp");background-repeat:no-repeat;background-size:800% 100%;background-color:#111}
    .navBtn{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(8,9,13,.66);backdrop-filter:blur(8px);color:#fff;font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .navBtn:hover{background:rgba(18,20,30,.9)} .prev{left:16px}.next{right:16px}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 18px;background:var(--panel);border-top:1px solid var(--line)}
    .toolbarLeft{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.badge{font-size:12px;color:#111;background:var(--lime);padding:6px 10px;border-radius:999px;font-weight:900}
    .small{font-size:13px;color:var(--muted)}
    .dots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:18px 10px 4px}.dot{width:10px;height:10px;border-radius:999px;background:rgba(255,255,255,.18);border:none;cursor:pointer;padding:0}.dot.active{background:var(--lime)}
    .thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.thumb{background:#0e1118;border:1px solid var(--line);border-radius:14px;padding:8px;cursor:pointer;aspect-ratio:16/9}.thumbSprite{display:block;width:100%;height:100%;border-radius:8px;background-image:url("opening-sprite.webp");background-repeat:no-repeat;background-size:800% 100%}.thumb.active{outline:2px solid var(--lime)}
    .frame-0{background-position:0% 0}.frame-1{background-position:14.28571429% 0}.frame-2{background-position:28.57142857% 0}.frame-3{background-position:42.85714286% 0}.frame-4{background-position:57.14285714% 0}.frame-5{background-position:71.42857143% 0}.frame-6{background-position:85.71428571% 0}.frame-7{background-position:100% 0}
    .wa-float{position:fixed;z-index:35;right:18px;bottom:18px;background:var(--lime);color:#111;border-radius:999px;padding:14px 20px;text-decoration:none;font-weight:900;box-shadow:0 16px 40px rgba(0,0,0,.35)}
    @media(max-width:900px){.thumbs{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:640px){.bar{height:58px;padding:0 12px}.brand{font-size:18px}.wrap{padding:22px 10px 84px}.intro{flex-direction:column;align-items:start}.viewer{border-radius:16px}.navBtn{width:42px;height:42px;font-size:24px}.prev{left:10px}.next{right:10px}.toolbar{flex-direction:column;align-items:start}.thumbs{grid-template-columns:repeat(2,1fr);gap:10px}.wa-float{right:12px;bottom:12px;padding:12px 16px}}
  </style>
</head>
<body>
  <header class="bar"><a class="brand" href="index.html">VΛLIA</a><div class="actions"><a class="btn ghost" href="index.html#caso">Volver</a><a class="btn primary whatsapp-link" data-wa-intent="empresa" href="#" target="_blank" rel="noopener">Evaluar AXIA</a></div></header>
  <main class="wrap">
    <section class="intro"><div><div class="small">VALIA · OPEN STATEMENT</div><h1>El caso completo en 8 láminas</h1><p>Recorre el caso completo en ocho láminas. Usa las flechas, las miniaturas o desliza en tu teléfono.</p></div><div class="counter"><span id="slideCounter">1 / 8</span></div></section>
    <section class="viewer" aria-label="Carrusel Open Statement"><div class="stage" id="stage"><button class="navBtn prev" id="prevBtn" aria-label="Lámina anterior">‹</button><div class="slide active"><div class="sprite frame-0" role="img" aria-label="Open Statement VALIA lámina 1"></div></div><div class="slide"><div class="sprite frame-1" role="img" aria-label="Open Statement VALIA lámina 2"></div></div><div class="slide"><div class="sprite frame-2" role="img" aria-label="Open Statement VALIA lámina 3"></div></div><div class="slide"><div class="sprite frame-3" role="img" aria-label="Open Statement VALIA lámina 4"></div></div><div class="slide"><div class="sprite frame-4" role="img" aria-label="Open Statement VALIA lámina 5"></div></div><div class="slide"><div class="sprite frame-5" role="img" aria-label="Open Statement VALIA lámina 6"></div></div><div class="slide"><div class="sprite frame-6" role="img" aria-label="Open Statement VALIA lámina 7"></div></div><div class="slide"><div class="sprite frame-7" role="img" aria-label="Open Statement VALIA lámina 8"></div></div><button class="navBtn next" id="nextBtn" aria-label="Siguiente lámina">›</button></div><div class="toolbar"><div class="toolbarLeft"><span class="badge">8 LÁMINAS</span><span class="small">Usa flechas, miniaturas o desliza si estás en móvil.</span></div><a class="btn primary whatsapp-link" data-wa-intent="empresa" href="#" target="_blank" rel="noopener">Hablar con Alberto</a></div></section>
    <div class="dots" id="dots"></div><div class="thumbs" id="thumbs"><button class="thumb active" data-slide="0" aria-label="Ir a lámina 1"><span class="thumbSprite frame-0"></span></button><button class="thumb" data-slide="1" aria-label="Ir a lámina 2"><span class="thumbSprite frame-1"></span></button><button class="thumb" data-slide="2" aria-label="Ir a lámina 3"><span class="thumbSprite frame-2"></span></button><button class="thumb" data-slide="3" aria-label="Ir a lámina 4"><span class="thumbSprite frame-3"></span></button><button class="thumb" data-slide="4" aria-label="Ir a lámina 5"><span class="thumbSprite frame-4"></span></button><button class="thumb" data-slide="5" aria-label="Ir a lámina 6"><span class="thumbSprite frame-5"></span></button><button class="thumb" data-slide="6" aria-label="Ir a lámina 7"><span class="thumbSprite frame-6"></span></button><button class="thumb" data-slide="7" aria-label="Ir a lámina 8"><span class="thumbSprite frame-7"></span></button></div>
  </main>
  <a class="wa-float whatsapp-link" data-wa-intent="empresa" href="#" target="_blank" rel="noopener">WhatsApp</a><script src="app.js"></script><script>const slides=Array.from(document.querySelectorAll('.slide')),counter=document.getElementById('slideCounter'),thumbs=Array.from(document.querySelectorAll('.thumb')),dotsWrap=document.getElementById('dots');let current=0;slides.forEach((_,idx)=>{const btn=document.createElement('button');btn.className='dot'+(idx===0?' active':'');btn.setAttribute('aria-label',`Ir a lámina ${idx+1}`);btn.addEventListener('click',()=>goTo(idx));dotsWrap.appendChild(btn)});const dots=Array.from(document.querySelectorAll('.dot'));function render(){slides.forEach((s,i)=>s.classList.toggle('active',i===current));thumbs.forEach((t,i)=>t.classList.toggle('active',i===current));dots.forEach((d,i)=>d.classList.toggle('active',i===current));counter.textContent=`${current+1} / ${slides.length}`}function goTo(i){current=(i+slides.length)%slides.length;render()}document.getElementById('prevBtn').addEventListener('click',()=>goTo(current-1));document.getElementById('nextBtn').addEventListener('click',()=>goTo(current+1));thumbs.forEach(t=>t.addEventListener('click',()=>goTo(Number(t.dataset.slide))));document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')goTo(current-1);if(e.key==='ArrowRight')goTo(current+1)});let startX=0;const stage=document.getElementById('stage');stage.addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX},{passive:true});stage.addEventListener('touchend',e=>{const delta=e.changedTouches[0].clientX-startX;if(Math.abs(delta)>40)goTo(delta<0?current+1:current-1)},{passive:true});</script>
</body>
</html>
