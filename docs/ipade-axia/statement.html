<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Open Statement VALIA</title>
  <meta name="description" content="El costo empresarial del estrés financiero y la infraestructura AXIA." />
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:#07080c;color:#fff;font-family:Inter,Arial,sans-serif}
    .bar{position:fixed;z-index:10;top:0;left:0;right:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:rgba(7,8,12,.88);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.14)}
    .brand{font-weight:900;letter-spacing:3px;font-size:22px;color:#fff;text-decoration:none}
    .actions{display:flex;gap:10px;align-items:center}
    .btn{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 16px;border-radius:999px;text-decoration:none;font-size:13px;font-weight:800}
    .ghost{border:1px solid rgba(255,255,255,.42);color:#fff}
    .primary{background:#c9ff00;color:#111}
    .viewer{position:fixed;inset:64px 0 0;background:#111}
    iframe{width:100%;height:100%;border:0;background:#111}
    .fallback{display:none;min-height:100%;align-items:center;justify-content:center;text-align:center;padding:30px}
    .fallback p{color:#c8c8cf;max-width:520px}
    @media(max-width:640px){.bar{height:58px;padding:0 12px}.brand{font-size:18px}.viewer{inset:58px 0 0}.ghost{display:none}.btn{padding:0 13px;font-size:12px}}
  </style>
</head>
<body>
  <header class="bar">
    <a class="brand" href="index.html">VΛLIA</a>
    <div class="actions">
      <a class="btn ghost" href="Opening_Statement_VALIA.pdf" target="_blank" rel="noopener">Abrir PDF</a>
      <a class="btn primary" href="index.html#diagnostico">Evaluar AXIA</a>
    </div>
  </header>
  <main class="viewer">
    <iframe src="Opening_Statement_VALIA.pdf#view=FitH&toolbar=1" title="Open Statement VALIA">
      <div class="fallback">
        <div>
          <h1>Open Statement VALIA</h1>
          <p>Tu navegador no pudo mostrar el documento dentro de la página.</p>
          <a class="btn primary" href="Opening_Statement_VALIA.pdf" target="_blank" rel="noopener">Abrir presentación</a>
        </div>
      </div>
    </iframe>
  </main>
</body>
</html>
