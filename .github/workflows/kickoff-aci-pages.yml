name: Publicar MVP AXIA ACI
on:
  push:
    branches: [main]
    paths:
      - 'kickoff-aci/**'
      - '.github/workflows/kickoff-aci-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: axia-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar sitio exclusivamente publico
        run: |
          mkdir -p site/kickoff-aci
          cp kickoff-aci/index.html kickoff-aci/operaciones.html kickoff-aci/logo-valia.svg site/kickoff-aci/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
